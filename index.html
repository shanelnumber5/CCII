<script>
(() => {
// Course-to-Resume Builder content.
// Categories and course keys are used to build the deck and identify local drafts.
// Within each category, course keys become the labels on course cards.
// Use learningOutcomes and workforceLanguage for the two language views.
// Sample bullets and reflection prompts appear in the Bullet Studio.

// Keep competency labels in the display order used in the course details.
const OFFICIAL_NACE_COMPETENCIES = [
  'Career & Self-Development',
  'Communication',
  'Critical Thinking',
  'Equity & Inclusion',
  'Leadership',
  'Professionalism',
  'Teamwork',
  'Technology'
];

const find = selector => document.querySelector(selector);
const form = find('form'), category = find('.category'), picker = find('.course'), message = find('.message');
const categorySelect = find('.category-select'), courseSelect = find('.course-select');
const categoryButton = categorySelect.querySelector('button'), courseButton = courseSelect.querySelector('button');
const categoryOptions = categorySelect.querySelector('.custom-options'), courseOptions = courseSelect.querySelector('.custom-options');
const intro = find('.intro'), article = find('article'), card = find('.card'), reading = find('.reading'), footer = find('footer');
const previous = find('.previous'), next = find('.next'), skip = find('.skip'), status = find('.status');
const names = ['School', 'Workforce', 'Résumé', 'Reflection & Personal Growth'];
const labels = ['School', 'Workforce', 'Résumé', 'Reflection'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const bg = find('.scene img'), ctx = find('.scene canvas').getContext('2d');
const stage = find('.stage'), scene = find('.scene');
let visibleWorldWidth = 1000;
function sizeCamera() {
  visibleWorldWidth = Math.min(1000, 563 * stage.clientWidth / Math.max(1, stage.clientHeight));
  positionScene(500);
  if (reduced.matches && ready) render(performance.now());
}
function positionScene(x) {
  const left = Math.max(0, Math.min(1000 - visibleWorldWidth, x - visibleWorldWidth / 2));
  scene.style.setProperty('--camera-x', -left / 10 + '%');
}
const nap = find('.nap').getContext('2d'), idle = find('.idle').getContext('2d'), sprites = new Image();
const poses = {sleep:[0,6],jump:[6,4],swim:[10,8],land:[18,3],idle:[21,12],walk:[33,3]};
// Leave clearance around the flagpole, including the cloud layer’s horizontal drift.
const sky = [
  [0,54],[80,49],[105,79],[148,72],[148,45],[234,45],[234,64],
  [360,79],[445,74],[620,10],[646,9],[813,74],[855,68],[950,76],[1000,67]
];
let course, step = -1, destination, dock = 91, started = 0, landedAt, departureX, ready = false, frameId, timer, skipSwimMode = false;
function setOptions(wrapper, select, button, list, options, disabled = false) {
  select.replaceChildren(...options.map(option => new Option(option.label, option.value)));
  list.replaceChildren(...options.map(option => {
    const item = document.createElement('li');
    const choice = document.createElement('button');
    choice.type = 'button';
    choice.textContent = option.label;
    choice.dataset.value = option.value;
    choice.setAttribute('role', 'option');
    choice.setAttribute('aria-selected', option.value === select.value ? 'true' : 'false');
    item.append(choice);
    return item;
  }));
  button.textContent = options.find(option => option.value === select.value)?.label ?? options[0]?.label ?? '';
  button.disabled = disabled;
  button.setAttribute('aria-expanded', 'false');
  wrapper.classList.toggle('is-disabled', disabled);
}
setOptions(categorySelect, category, categoryButton, categoryOptions, [
  {label:'Choose a category', value:''},
  ...Object.entries(courseCategories)
    .map(([value, group]) => ({label:group.label, value}))
    .sort((first, second) => first.label.localeCompare(second.label, 'en'))
]);
function filter() {
  const group = courseCategories[category.value];
  const options = group ? [{label:'Choose a course', value:''}, ...group.courseCodes.map(code => ({label:coursesByCode[code].title, value:code}))] : [{label:'Choose a category first', value:''}];
  setOptions(courseSelect, picker, courseButton, courseOptions, options, !group);
  message.textContent = '';
}
function text(parent, tag, value, className) {
  const node = document.createElement(tag);
  node.textContent = value;
  if (className) node.className = className;
  parent.append(node);
  return node;
}
function list(title, items) {
  if (!items?.length) return;
  text(reading,'h3',title);
  const ul = text(reading,'ul','');
  items.forEach(item => text(ul,'li',item));
}
function openCard(index) {
  clearTimeout(timer);
  destination = undefined;
  step = index;
  card.classList.remove('intro-mode');
  intro.hidden = true;
  article.hidden = false;
  footer.hidden = false;
  card.hidden = false;
  skip.hidden = true;
  status.textContent = '';
  find('.step').textContent = 'STEP ' + (index + 1) + ' OF ' + names.length;
  find('h2').textContent = names[index];
  find('.course-name').textContent = course.title;
  find('.count').textContent = (index + 1) + ' / ' + names.length;
  previous.disabled = index === 0;
  next.disabled = index === names.length - 1;
  previous.textContent = index ? '← ' + labels[index - 1] : '← Previous';
  next.textContent = next.disabled ? 'Next →' : labels[index + 1] + ' →';
  reading.replaceChildren();
  if (index === 0) {
    const meta = [course.credits,course.term].filter(Boolean).join(' · ');
    if (meta) text(reading,'p',meta,'metadata');
    if (course.description) text(reading,'p',course.description);
    if (course.practice) list('What you’ll practice',course.practice);
    else list('Learning outcomes',course.learningOutcomes);
  } else if (index === 1) {
    list('Workforce language',course.workforceLanguage);
    list('Transferable skills',course.skills);
    list('NACE competencies',course.nace);
  } else if (index === 2) {
    list('Résumé bullet examples',course.bullets);
  } else {
    list('Reflection prompts',course.reflection);
    list('Personal growth',course.growth);
  }
  reading.scrollTop = 0;
  card.classList.remove('arrive');
  void card.offsetWidth;
  card.classList.add('arrive');
  find('h2').focus();
  if (reduced.matches && ready) render(performance.now());
}
const walkDuration = 560;
function bankProgress(now) {
  if (landedAt === undefined || reduced.matches) return 0;
  return Math.max(0, Math.min(1, (now - landedAt) / walkDuration));
}
function bankX(progress) {
  return dock + (dock === 91 ? -1 : 1) * 18 * progress;
}
function finish() {
  if (destination === undefined) return;
  dock = dock === 91 ? 923 : 91;
  landedAt = performance.now();
  openCard(destination);
}
function skipSwim() {
  skipSwimMode = true;
  clearTimeout(timer);
  if (destination !== undefined) {
    card.hidden = false;
    status.textContent = '';
  }
  finish();
}
function cross(index) {
  if (index < 0 || index >= names.length || destination !== undefined) return;
  if (reduced.matches || !ready || skipSwimMode) { openCard(index); return; }
  destination = index;
  started = performance.now();
  departureX = bankX(1 - (1 - bankProgress(started)) ** 2);
  card.hidden = true;
  skip.hidden = false;
  status.textContent = 'Mo is swimming to ' + names[index] + '.';
  skip.focus();
  timer = setTimeout(finish,2450);
}
function sprite(target, pose, frame, x, y, height=84, width=120) {
  const [first,count] = poses[pose], tile = first + frame % count;
  target.imageSmoothingEnabled = false;
  target.drawImage(sprites,tile%8*100,Math.floor(tile/8)*70,100,70,x,y,width,height);
}
const riverEdge = [[0,399],[150,399],[153,386],[874,386],[877,392],[1000,395],
  [1000,449],[967,466],[943,482],[902,489],[859,509],[815,517],[755,563],
  [307,563],[280,550],[245,522],[189,521],[159,530],[120,502],[99,480],[59,478],[38,459],[0,447]];
const foliage = [
  {bounds:[0,47,153,225],edge:[[0,63],[15,54],[44,53],[72,48],[104,61],[125,91],[125,113],[153,133],[151,158],[127,178],[135,202],[120,225],[95,215],[85,193],[55,185],[39,218],[18,209],[0,185]],speed:880},
  {bounds:[860,113,1000,267],edge:[[861,160],[881,145],[891,127],[922,120],[958,113],[982,124],[1000,142],[1000,244],[979,250],[958,235],[939,242],[920,258],[897,267],[871,252],[861,224]],speed:970},
  {bounds:[160,359,872,372],edge:[[160,361],[871,359],[858,370],[160,372]],speed:900,amplitude:.6},
  {bounds:[0,321,165,334],edge:[[0,326],[46,323],[165,321],[158,334],[0,334]],speed:1000,amplitude:.6},
  {bounds:[0,445,72,496],edge:[[0,446],[18,449],[39,458],[67,461],[56,477],[42,491],[0,493]],speed:430},
  {bounds:[92,495,164,563],edge:[[95,495],[119,498],[139,509],[164,513],[154,531],[138,552],[127,563],[102,555]],speed:520},
  {bounds:[782,505,860,563],edge:[[783,516],[801,506],[824,512],[860,516],[850,530],[825,553],[807,563],[787,563]],speed:460},
  {bounds:[937,446,1000,511],edge:[[938,458],[957,450],[986,446],[1000,452],[1000,508],[967,511],[958,488]],speed:480}
];
function clipShape(points) {
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.closePath();
  ctx.clip();
}
function breeze(time, w, h) {
  const sx=w/1000, sy=h/563;
  for (const {bounds:[left,top,right,bottom],edge,speed,amplitude=2.4} of foliage) {
    ctx.save();
    clipShape(edge);
    for (let y=top;y<bottom;y+=4) {
      const sway=Math.sin(time/speed+y*.06)*Math.min(amplitude,(bottom-y)*.17);
      const height=Math.min(4,bottom-y);
      ctx.drawImage(bg,left*sx,y*sy,(right-left)*sx,height*sy,left+sway,y,right-left,height);
    }
    ctx.restore();
  }
  ctx.save();
  clipShape([[176,66],[198,73],[221,84],[224,123],[201,116],[176,103]]);
  for (let x=176;x<224;x+=2) {
    const flap=Math.sin(time/210-(x-176)*.19)*(x-176)/15;
    ctx.drawImage(bg,x*sx,63*sy,2*sx,63*sy,x,63+flap,2,63);
  }
  ctx.restore();
}
function riverMotion(time) {
  ctx.save();
  clipShape(riverEdge);
  for (let i=0;i<56;i++) {
    const depth=i%5, speed=.012+depth*.008;
    const x=((i*173+time*speed)%1050)-25;
    const y=391+depth*33+(i*11)%29;
    const opacity=.16+.25*(.5+.5*Math.sin(time/460+i));
    ctx.globalAlpha=opacity;
    ctx.fillStyle=i%9===0?'#ffd47a':'#70c5df';
    const length=5+depth*3+i%8;
    ctx.fillRect(Math.round(x),y,length,depth>2?2:1);
    ctx.fillRect(Math.round(x+length+4),y-1,Math.max(3,length/3),1);
  }
  ctx.restore();
}
function shoreIdle(time) {
  const phase = Math.max(0, time - (landedAt ?? time) - walkDuration) % 3100;
  const lift = phase < 850 ? 2.3 * Math.sin(Math.PI * phase / 850) ** 2 : 0;
  if (!lift || reduced.matches) {
    sprite(ctx,'swim',7,-46,-60,64,92);
    return;
  }
  const tile = poses.swim[0] + 7;
  const sx = tile % 8 * 100, sy = Math.floor(tile / 8) * 70;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sprites,sx,sy,66,70,-46,-60,60.72,64);
  for (let x = 66; x < 100; x += 2) {
    const headLift = lift * Math.min(1,(x - 66) / 12);
    ctx.drawImage(sprites,sx+x,sy,2,70,-46+x*.92,-60-headLift,1.84,64);
  }
}
const reflectionPanes = [
  [615,139,19,16],[637,137,25,18],[665,135,24,20],[692,135,8,20],
  [637,194,25,10],[665,194,24,10],[692,194,7,10],[637,207,25,8]
];
const reflectionArt = new Image();
reflectionArt.src = 'assets/window-reflections.png';

function drawWindowReflections(time) {
  if (!reflectionArt.complete || !reflectionArt.naturalWidth) return;

  const drift = 1.8 * Math.sin(time / 2600);
  reflectionPanes.forEach(([left, top, width, height], index) => {
    const row = index * 20;
    ctx.save();
    ctx.beginPath();
    ctx.rect(left, top, width, height);
    ctx.clip();
    ctx.drawImage(reflectionArt, 0, row, width, height, left, top, width, height);
    ctx.drawImage(reflectionArt, 25, row, width, height, left + drift, top, width, height);
    ctx.restore();
  });
}

function scenery(time, x, zoom) {
  const tightCrop = visibleWorldWidth < 900;
  positionScene(tightCrop && destination !== undefined ? x : 500);
  if (tightCrop) zoom = 1;
  const dx=Math.min(0,Math.max(1000*(1-zoom),490-x*zoom)), dy=563*(1-zoom)*.7;
  bg.style.transform='translate('+dx/10+'%, '+dy/563*100+'%) scale('+zoom+')';
  ctx.resetTransform();
  ctx.clearRect(0,0,1000,563);
  ctx.setTransform(zoom,0,0,zoom,dx,dy);
  if (!time || !bg.naturalWidth) return;
  const w=bg.naturalWidth,h=bg.naturalHeight;
  ctx.save();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1000,0);
  for(let i=sky.length-1;i>=0;i--)ctx.lineTo(...sky[i]);
  ctx.closePath();ctx.clip();
  ctx.drawImage(bg,0,0,w,h*.19,14*Math.sin(time/2600),0,1000,107);
  ctx.restore();
  drawWindowReflections(time);
  breeze(time, w, h);
  riverMotion(time);
}
function render(now) {
  if (!ready) return;
  const motion = reduced.matches ? 0 : now;
  if (destination === undefined) {
    scenery(motion,dock,1);
    const sleeping = !intro.hidden;
    const target = sleeping ? nap : idle;
    const frame = Math.floor(motion/(sleeping?180:245));
    if (!sleeping) {
      const onLeft = dock === 91;
      ctx.save();
      const progress = bankProgress(now);
      const walking = progress > 0 && progress < 1;
      const distance = 1 - (1 - progress) ** 2;
      ctx.translate(bankX(distance), onLeft ? 334 - 9 * distance : 351);
      if (onLeft) ctx.scale(-1,1);
      if (walking) sprite(ctx,'walk',Math.floor(progress * 6),-46,-64,64,92);
      else shoreIdle(now);
      ctx.restore();
    }
    target.clearRect(0,0,100,70);
    sprite(target,sleeping?'sleep':'idle',frame,0,sleeping?-28:0,70,100);
    return;
  }
  const elapsed=now-started;
  if(elapsed>=2260){finish();return;}
  const direction=dock===91?1:-1, progress=elapsed/2260;
  const landing = Math.max(0, (elapsed - 1900) / 360);
  const travel = (Math.min(elapsed,1900) + 360 * (landing + landing ** 2 - landing ** 3)) / 2260;
  const x=departureX+((direction===1?923:91)-departureX)*travel, startY=dock===91?334:351, endY=dock===91?351:334;
  let pose,frame,y;
  if(elapsed<390){
    const p=elapsed/390;pose='jump';frame=Math.floor(p*4);y=startY+(399-startY)*p-48*Math.sin(Math.PI*p);
  }else if(elapsed<1900){
    const p=(elapsed-390)/1510;pose='swim';frame=Math.floor(elapsed/91);y=399+15*Math.sin(Math.PI*p);
  }else{
    pose='land';frame=Math.floor(landing*3);
    y=399+(endY-399)*landing*landing*(3-2*landing);
  }
  scenery(motion,x,1+.4*Math.sin(Math.PI*progress));
  ctx.save();ctx.translate(x,y);ctx.scale(direction,1);
  if(pose==='swim'){ctx.beginPath();ctx.rect(-60,-70,120,72);ctx.clip();}
  sprite(ctx,pose,frame,-60,pose==='swim'?-57:-84);
  ctx.restore();
  if(pose==='swim'){
    ctx.save();
    clipShape(riverEdge);
    for(let i=0;i<18;i++){
      const left=Math.round(x-50+i*6), phase=i*.55+elapsed/95, crest=Math.round(y-2+2*Math.sin(phase));
      ctx.fillStyle='#135e91';ctx.fillRect(left,crest,6,3);
      if(Math.cos(phase)>.1){ctx.fillStyle='#89d4e4';ctx.fillRect(left,crest,4,1);}
    }
    ctx.restore();
  }
}
function loop(now) {
  render(now);
  if (!reduced.matches || destination !== undefined) frameId = requestAnimationFrame(loop);
}
function closeMenus() {
  [categorySelect, courseSelect].forEach(select => {
    select.querySelector('.custom-options').hidden = true;
    select.querySelector('button').setAttribute('aria-expanded', 'false');
  });
}
function openMenu(wrapper) {
  closeMenus();
  const list = wrapper.querySelector('.custom-options');
  if (!wrapper.classList.contains('is-disabled')) {
    list.hidden = false;
    wrapper.querySelector('button').setAttribute('aria-expanded', 'true');
  }
}
function choose(wrapper, select, button, event) {
  const choice = event.target.closest('button[data-value]');
  if (!choice) return;
  select.value = choice.dataset.value;
  button.textContent = choice.textContent;
  wrapper.querySelectorAll('[role="option"]').forEach(option => option.setAttribute('aria-selected', option === choice ? 'true' : 'false'));
  closeMenus();
  select.dispatchEvent(new Event('change'));
}
categoryButton.addEventListener('click', () => openMenu(categorySelect));
courseButton.addEventListener('click', () => openMenu(courseSelect));
categoryOptions.addEventListener('click', event => choose(categorySelect, category, categoryButton, event));
courseOptions.addEventListener('click', event => choose(courseSelect, picker, courseButton, event));
category.addEventListener('change',filter);
picker.addEventListener('change',()=>{message.textContent='';});
document.addEventListener('click', event => {
  if (!event.target.closest('.custom-select')) closeMenus();
});
form.addEventListener('submit',event=>{
  event.preventDefault();
  const group = courseCategories[category.value];
  const selected = group?.courseCodes.includes(picker.value) ? coursesByCode[picker.value] : undefined;
  if(!selected){message.textContent=category.value?'Choose a course to start.':'Choose a course category to start.';(category.value?picker:category).focus();return;}
  course=selected;
  cross(0);
});
find('.change').addEventListener('click',()=>{
  step=-1;landedAt=undefined;skipSwimMode=false;article.hidden=true;footer.hidden=true;intro.hidden=false;card.classList.remove('arrive');card.classList.add('intro-mode');find('h1').focus();
  if(reduced.matches&&ready)render(performance.now());
});
previous.addEventListener('click',()=>cross(step-1));
next.addEventListener('click',()=>cross(step+1));
skip.addEventListener('click',skipSwim);
window.addEventListener('resize', sizeCamera);
sizeCamera();
sprites.onload=()=>{ready=true;loop(performance.now());};
// Refresh the sprite sheet on hosted copies and keep the local file path simple.
sprites.src = location.protocol === 'file:'
  ? 'assets/mo-sprites.png'
  : 'assets/mo-sprites.png?v=shore-frame-fix';
})();
</script>
