<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mo’s Résumé River</title>
<style>
*{box-sizing:border-box} [hidden]{display:none!important} body{margin:0;background:#06152c;color:#fff9e8;font:16px/1.5 system-ui,sans-serif}
main{width:100%}
.stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden;background:#092e58;perspective:900px}
.stage::before{content:"";position:absolute;inset:0;background:linear-gradient(#06152c30,#06152c66),var(--campus-art) center/cover no-repeat}
@media(min-aspect-ratio:8/5){
  .stage .scene{left:50%;right:auto;width:max(100%,177.62vh);width:max(100%,177.62dvh);transform:translate(-50%,-50%)}
}
.scene{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);overflow:hidden}.scene img{display:block;width:100%;height:auto;transform-origin:0 0}.scene canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.layer{position:absolute;inset:0;display:grid;place-items:center;padding:16px clamp(16px,5%,48px);pointer-events:none}
.card{width:min(100%,640px);max-height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#071f42;border:2px solid #edaa00;box-shadow:0 0 0 4px #071f42,0 12px 28px #0008;pointer-events:auto}
.arrive{animation:flip .52s ease-out both}@keyframes flip{from{transform:rotateY(-35deg) scale(.94);opacity:.6}to{transform:none;opacity:1}}
.intro,.reading{padding:16px 20px;overflow:auto;min-height:0}.eyebrow{margin:0 0 4px;color:#ffda7c;font-size:12px;font-weight:750;letter-spacing:.12em}
h1,h2{font:700 clamp(25px,4vw,38px)/1.1 Georgia,serif;margin:0} p{margin:6px 0 11px}.intro>p:not(.eyebrow),.course-name{color:#d2e7f7}
form{display:grid;gap:8px}label{font-size:14px;font-weight:700}.select{display:block;position:relative;margin-top:4px}.select::after{content:"▼";position:absolute;right:2px;top:2px;bottom:2px;display:grid;place-items:center;width:37px;background:#edaa00;color:#071f42;pointer-events:none}
select{appearance:none;display:block;width:100%;min-height:45px;background:white;color:#071f42;color-scheme:light;border:1px solid #b4c7d7;border-radius:4px;padding:6px 43px 6px 9px;font:650 17px system-ui}select option{color:#071f42;background:white}select:disabled{background:#e2ebf2}
button{min-height:44px;border:1px solid #88a5bc;background:#153b60;color:white;border-radius:5px;padding:6px 12px;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.55;cursor:default}
:is(button,select,summary):focus-visible{outline:3px solid #ffda7c;outline-offset:2px} .primary{background:#edaa00;color:#071f42;border-color:#edaa00}.start-row{display:flex;justify-content:flex-end;align-items:center;gap:9px}.start-row button{min-width:105px}.mascot{image-rendering:pixelated;width:82px;height:57px;flex:none}.start-row canvas{height:42px;width:100px}.message{color:#ffda7c;margin:0}.message:empty{display:none}
article{display:flex;flex-direction:column;min-height:0}.info-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 17px}.course-name{margin:4px 0;font-weight:700;overflow-wrap:anywhere}
.reading{background:#faf6eb;color:#102b47;scrollbar-gutter:stable;overscroll-behavior:contain}.reading h3{margin:0 0 5px;border-bottom:1px solid #a0b2c0;font-size:16px}.reading ul{margin:0 0 12px;padding-left:21px}.reading li{padding:5px 0}.reading li+li{border-top:1px solid #d4dfe5}.metadata{font-weight:700;color:#31526f}
footer,nav{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap}footer{padding:7px 10px;border-top:1px solid #7895ad;background:#0e3154}.change{background:transparent;border-color:transparent;text-decoration:underline}.status,.skip{position:absolute;bottom:8px}.status{left:8px;background:#071f42;margin:0;padding:6px 8px}.status:empty{display:none}.skip{right:8px}
@media(max-width:520px){.intro,.reading{padding:12px}.info-head{padding:10px 12px}nav{width:100%}}
@media(prefers-reduced-motion:reduce){.arrive{animation:none}}
</style>
